# Flowbot - docker-compose.yml
#
# Settings live in .env beside this file. After changing .env, run:
#   docker compose up -d
# (a plain "docker compose restart" does NOT load new settings)

name: flowbot

services:
  flowbot:
    image: ghcr.io/dilunvass/flowbot:${FLOWBOT_VERSION:-v1.0.1}
    restart: unless-stopped
    env_file: .env
    environment:
      APP_VERSION: ${FLOWBOT_VERSION:-v1.0.1}
    ports:
      - "${FLOWBOT_PORT:-8000}:8000"
    volumes:
      # The database and uploaded documents. Back this up.
      - flowbot-data:/app/backend/data
      # The GGUF model for LLM_MODE=in_process. See models/README.md.
      - ./models:/app/backend/llm_models:ro
    # Lets LLM_MODE=http reach an Ollama running on this server at
    # http://host.docker.internal:11434/v1.
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  flowbot-data:
